{%- comment -%}
  Map of trips. Pins and groups come from _data/map.yml; nesting is resolved in assets/js/map.js. Use {% include trip-map.html %}
  anywhere; add compact=true for a shorter version (e.g. on the homepage).
{%- endcomment -%}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="{{ '/assets/css/map.css' | relative_url }}">
<div class="trip-map{% if include.compact %} trip-map-compact{% endif %}" data-trip-map data-carto-key="{{ site.carto_key }}" role="region" aria-label="Map of places Marshall has photographed"></div>
<script type="application/json" class="trip-map-data">{"groups": {{ site.data.map.groups | default: "" | jsonify }}, "trips": [
{%- assign first = true -%}
{%- assign sorted = site.galleries | sort: "order" -%}
{%- for g in sorted -%}
  {%- assign p = site.data.map[g.slug] -%}
  {%- assign in_group = false -%}
  {%- for pair in site.data.map.groups -%}{%- if pair[1].trips contains g.slug -%}{%- assign in_group = true -%}{%- break -%}{%- endif -%}{%- endfor -%}
  {%- if p and p.size >= 2 or in_group -%}
    {%- capture cover -%}{% include cover-url.html gallery=g %}{%- endcapture -%}
    {%- unless first -%},{%- endunless -%}{%- assign first = false %}
  {"slug": {{ g.slug | jsonify }}, "title": {{ g.title | jsonify }}, "url": {{ g.url | relative_url | jsonify }}, "location": {{ g.location | default: "" | jsonify }}, "cover": {{ cover | strip | jsonify }}{% if p and p.size >= 2 %}, "lat": {{ p[0] }}, "lng": {{ p[1] }}, "spot": {{ p[2] | default: "" | jsonify }}{% endif %}}
  {%- endif -%}
{%- endfor %}
]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="{{ '/assets/js/map.js' | relative_url }}" defer></script>
