---
layout: default
---
<section class="wrap section-page">
  <header class="section-head">
    <h1>{{ page.title }}</h1>
    {% assign intro = content | strip %}
    {% if intro != "" %}<div class="notes">{{ content }}</div>{% endif %}
  </header>
  {% assign items = site.galleries | where: "section", page.key | sort: "order" %}
  <ul class="tiles">
    {% for g in items %}{% include tile.html gallery=g %}{% endfor %}
  </ul>
</section>
