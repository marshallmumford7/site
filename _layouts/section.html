---
layout: default
---
<section class="wrap section-page">
  <header class="section-head">
    <h1>{{ page.title }}</h1>
    {% assign intro = content | strip %}
    {% if intro != "" %}<div class="notes">{{ content }}</div>{% endif %}
  </header>
  {% include sorted-trips.html %}
  <ul class="tiles">
    {% for g in sorted_trips %}{% include tile.html gallery=g %}{% endfor %}
  </ul>
</section>
