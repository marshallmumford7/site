<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.author }} Photography</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.author }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.cover | default: site.hero_image | absolute_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/icon.png' | relative_url }}">
  <meta name="theme-color" content="#71a1af"><text y='.9em' font-size='90'>🪶</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/lightbox.js' | relative_url }}" defer></script>
  {% if page.body_class == "home" %}<script src="{{ '/assets/js/slideshow.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
